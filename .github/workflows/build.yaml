name: 🛠️ Build
on:
  push:
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
    strategy:
      fail-fast: false
      matrix:
        godot-version: [4.1.2, 4.1.3-rc.1, 4.2.0-beta.3]
        dotnet-version: [7.0, 8.0]
        export-template: [Linux, Windows, macOS]

    steps:
      - name: 🧾 Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: 'recursive'

      - name: 🎥 Setup Blender
        run: sudo apt-get install -y blender

      - name: 💽 Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: 🤖 Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: ${{ matrix.godot-version }}
          use-dotnet: true

      - name: 📦 Restore Dependencies
        run: dotnet restore

      - name: 🧑‍🔬 Generate .NET Bindings
        run: godot --headless --build-solutions --quit

      - name: 🦺 Build Project
        run: dotnet build

      - name: ⚙️ Godot Configuration for Export
        run: |
          BLENDER_LOCATION=$(whereis blender | awk '{print($2)}')
          echo "Blender Location: $BLENDER_LOCATION"

          cat >> ~/.config/godot/editor_settings-4.tres << EOF
          filesystem/import/blender/blender3_path = "$BLENDER_LOCATION"
          EOF

          echo "Godot settings:"
          cat ~/.config/godot/editor_settings-4.tres

      - name: 🎁 Export Project
        run: |
          mkdir -p "out/${{ matrix.export-template }}"
          godot --headless --export-release "${{ matrix.export-template }}" "out/${{ matrix.export-template }}"

      - name: Debug
        run: |
          cat ~/.config/godot/editor_settings-4.tres

          echo ""
          ls -al -R out/
