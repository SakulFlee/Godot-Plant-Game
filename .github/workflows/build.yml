name: Build

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  debug:
    name: Debug
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4

    - name: Make output folder
      run: mkdir -p out/debug

    - name: Godot - Debug Export
      run: godot --headless --export-debug Linux out/debug .

  release:
    name: Release
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4

    - name: Make output folder
      run: mkdir -p out/release

    - name: Godot - Release Export
      run: godot --headless --export-release Linux out/release .
