name: Build

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4

    - name: Rust - Debug Build
      run: cargo build

    - name: Rust - Release Build
      run: cargo build --release

    - name: Make output folder
      run: mkdir -p out/debug out/release

    - name: Godot - Debug Export
      run: godot --export-debug Linux out/debug

    - name: Godot - Release Export
      run: godot --export-release Linux out/release
