name: Build

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  debug:
    name: Debug
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4

    - name: Make output folder
      run: mkdir -p out/debug

    - name: Godot - Debug Export
      run: |
        OUTPUT="$(godot --headless --export-debug Linux out/debug . 2>&1)"
        echo -e "Output:\n$OUTPUT"
        if $OUTPUT |& grep "Cannot export project"
        then
          echo "ERROR found in godot output!"
          exit -1
        fi

  release:
    name: Release
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4

    - name: Make output folder
      run: mkdir -p out/release

    - name: Godot - Release Export
      run: |
        OUTPUT="$(godot --headless --export-release Linux out/release . 2>&1)"
        echo -e "Output:\n$OUTPUT"
        if $OUTPUT |& grep "Cannot export project"
        then
          echo "ERROR found in godot output!"
          exit -1
        fi
